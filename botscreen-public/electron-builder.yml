appId: com.electron.app
productName: botscreen
directories:
  buildResources: build
files:
  # Positive runtime whitelist: a packaged app contains ONLY the built renderer
  # output and the app manifest. electron-builder adds the production
  # node_modules itself (all code is bundled by electron-vite, so upgrades in
  # SCA-1 may shrink that further). Everything else — server/, scripts/,
  # tests, swagger, configs, docs, .env*, certificates — is excluded by
  # construction and additionally enforced by scripts/asar-manifest.mjs --check.
  - 'out/**'
  - 'package.json'
asarUnpack:
  - resources/**
win:
  executableName: botscreen
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
