topics:
- question: 眼轴长度是多少
  answer: '每个小朋友的眼睛里都有一个叫"眼轴"的东西，它就像眼睛的"身高"一样，会随着你长大而变长～


    不同年龄小朋友的平均眼轴长度：

    6岁→22.46mm | 7岁→22.56mm | 8岁→22.78mm | 9岁→22.95mm

    10岁→23.13mm | 11岁→23.26mm | 12岁→23.32mm


    记得每三个月检查一次，建立视觉健康档案哦！📋💕'
- question: 近视是怎么分级的
  answer: '近视按度数分成三个等级哦～👓


    🟢 轻度近视：-3.00D 以下（不到300度）

    🟡 中度近视：-3.00D 到 -6.00D（300-600度）

    🔴 高度近视：-6.00D 以上（超过600度）


    度数越高，视网膜就越脆弱，要好好保护眼睛！💪'
- question: 什么是近视
  answer: '眼睛就像一台超级精密的照相机📷，帮我们看清美丽的世界～


    但如果这台"照相机"的镜头度数太高了，我们就看不清远处的东西了，这就是近视。


    科学家发现：度数涨得很高的话，眼睛里叫"视网膜"的重要零件（就像相机的底片）就会变得脆弱，更容易生病！


    所以保护眼睛从现在开始吧～🌟'
- question: 看多久要休息眼睛
  answer: '记住"20-20-20"魔法法则！🪄


    📖 看书、做作业或看电视的时候——

    ⏰ 每 20 分钟左右

    👀 望向 20 英尺（大约6米）远的地方

    🕐 至少看 20 秒钟


    就像给眼睛做"课间操"一样，让它放松一下～'
- question: 正确读写姿势是什么
  answer: '读写姿势记住"一拳一尺一寸"！✊📏


    ✊ 一拳：胸口离桌子一个拳头距离

    📏 一尺：眼睛离书本一尺（约33厘米）

    ☝️ 一寸：手指离笔尖一寸（约3厘米）


    坐直了，眼睛和身体都会感谢你的！😊'
- question: 每天要在外面玩多久
  answer: '每天去户外运动是保护眼睛的"超级武器"！☀️


    ⏰ 中小学生每天至少需要 2 小时的户外运动～


    因为阳光会让身体产生"多巴胺"，能有效预防近视！


    下课后去操场上跑一跑，看看远处的绿色植物，眼睛和身体都会棒棒的！🏃‍♂️🌳✨'
- question: 看书要开灯吗
  answer: '用眼光线很重要！💡


    ☀️ 光线太强 → 刺激眼睛不舒服

    🌙 光线太暗 → 眼睛看不清容易累


    正确做法：

    ✅ 自然光充足时直接利用

    ✅ 用台灯时亮度以不刺眼为宜

    ✅ 台灯 + 房间顶灯同时开

    ✅ 台灯光线从左前方照过来


    这样书本就不会被阴影挡住啦～📖✨'
- question: 吃什么对眼睛好
  answer: '好好睡觉 + 好好吃饭 = 眼睛健康！😴🥕


    😴 充足睡眠：晚上是眼睛休息的宝贵时间


    🥗 均衡饮食：

    ✅ 多吃：鱼肉🐟、水果🍎、蔬菜🥬、豆制品🫘、鸡蛋🥚

    ❌ 少吃：甜食🍰、辛辣食物🌶️、含糖饮料🥤


    维生素A、叶黄素、Omega-3 都是眼睛的好朋友哦～'
- question: 为什么要检查眼睛
  answer: '每个小朋友都应该有一份"视觉健康档案"！📋


    就像每年量身高体重一样，眼睛也需要定期检查～


    ⏰ 建议每 3 个月检查一次

    📝 记录：视力、眼轴长度、屈光度


    早发现问题早处理，让眼睛健健康康陪你长大！💕'
