- name: 裴颖
  title: 中级视光师
  intro: >
    擅长青少年近视、远视、散光的验配；双眼视的检查、诊断及处理；从事对弱视、视疲劳、视觉相关阅读障碍的诊断及相应的视觉训练及治疗工作。
    2009年获得和平区验光配镜比武大赛第三名，2011年获得天津市验光配镜比武大赛第一名。毕业于天津医科大学，本科。
    2019年赴美国太平洋大学专修视觉训练，美国视觉发育视光学（COVD）会员。从事眼视光临床教学工作30余年。参编《眼视光临床与实践》等。
  tag: [近视, 远视, 散光, 弱视, 视疲劳, 双眼视, 视觉训练]
  image: rc://members/picture/裴颖.jpg

- name: 李雪
  title: 高级视光师
  intro: >
    擅长青少年近视防控，角膜塑形镜及多焦点接触镜的验配，成功验配角膜塑形镜几千例；
    擅长视疲劳、假性近视、功能性视力下降等双眼视功能异常的诊断并制定个性化矫正方案；
    擅长干眼的诊断与管理以及中老年渐进眼镜的验配。
    天津市眼科医院视光中心高级验光师，从事眼视光临床工作近20年。
    IAOA会员，具备GCP资质，参与多项临床试验，承担临床带教与教学工作，在专业期刊发表论文。
  tag: [近视, 角膜塑形镜, 多焦点镜, 视疲劳, 干眼, 双眼视]
  image: rc://members/picture/李雪.jpg

- name: 王宏
  title: 高级视光师
  intro: >
    擅长青少年近视防控，斜弱视屈光诊疗，双眼视异常诊断，圆锥角膜早期诊断和治疗，
    以及中老年阅读障碍诊疗。对角膜塑形镜、离焦RGP、离焦软镜、离焦框架镜及渐进多焦点镜
    具有丰富临床经验。
    天津医科大学临床医学本科毕业，从事眼视光临床与教学工作二十余年，
    多次在国内外学术会议发言并获奖，参编多部专业书籍。
  tag: [近视, 斜弱视, 双眼视, 圆锥角膜, 角膜塑形镜]
